name: Publish Node Agent to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (for example: v0.0.6)."
        required: false
        type: string
      dist_tag:
        description: "npm dist-tag to apply (for example: next or latest)."
        required: false
        type: string

jobs:
  publish:
    name: Publish @cloudless-ai/node-agent
    if: ${{ github.event_name != 'release' || !contains(github.event.release.tag_name, '-pr.') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          REF_NAME="${GITHUB_REF_NAME}"
          REF_TYPE="${GITHUB_REF_TYPE}"

          if [[ -n "${RELEASE_TAG}" ]]; then
            TAG="${RELEASE_TAG}"
          elif [[ -n "${TAG_INPUT}" ]]; then
            TAG="${TAG_INPUT}"
          elif [[ "${REF_TYPE}" == "tag" && "${REF_NAME}" == v* ]]; then
            TAG="${REF_NAME}"
          else
            echo "No release tag available. Provide a tag input."
            exit 1
          fi

          if [[ "${TAG}" != v* ]]; then
            echo "Tag must start with v. Got ${TAG}"
            exit 1
          fi

          VERSION="${TAG#v}"
          if [[ -n "${RELEASE_TAG}" ]]; then
            if [[ "${RELEASE_PRERELEASE}" == "true" || "${VERSION}" == *-* ]]; then
              DIST_TAG="next"
            else
              DIST_TAG="latest"
            fi
          elif [[ -n "${DIST_TAG_INPUT}" ]]; then
            DIST_TAG="${DIST_TAG_INPUT}"
          elif [[ "${VERSION}" == *-* ]]; then
            DIST_TAG="next"
          else
            DIST_TAG="latest"
          fi

          if [[ "${VERSION}" == *-* && "${DIST_TAG}" == "latest" ]]; then
            echo "Refusing to publish prerelease version ${VERSION} under the latest dist-tag."
            exit 1
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "dist_tag=${DIST_TAG}" >> "$GITHUB_OUTPUT"
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || '' }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease || false }}
          TAG_INPUT: ${{ github.event.inputs.tag || '' }}
          DIST_TAG_INPUT: ${{ github.event.inputs.dist_tag || '' }}

      - name: Check whether npm version already exists
        id: existing
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          DIST_TAG: ${{ steps.tag.outputs.dist_tag }}
        run: |
          set -euo pipefail
          PACKAGE_NAME="@cloudless-ai/node-agent"
          if EXISTING_VERSION="$(npm view "${PACKAGE_NAME}@${VERSION}" version 2>&1)"; then
            echo "${PACKAGE_NAME}@${VERSION} already exists; applying dist-tag ${DIST_TAG}."
            npm dist-tag add "${PACKAGE_NAME}@${VERSION}" "${DIST_TAG}"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif [[ "${EXISTING_VERSION}" == *E404* ]]; then
            echo "Version ${VERSION} is not published yet."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "${EXISTING_VERSION}" >&2
            exit 1
          fi

      - name: Download npm package tarball from release
        id: asset
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p dist

          mapfile -t RELEASE_ASSETS < <(gh release view "${TAG}" --repo "${REPO}" --json assets --jq '.assets[].name')
          mapfile -t TGZ_ASSETS < <(printf '%s\n' "${RELEASE_ASSETS[@]}" | grep -E '\.tgz$' || true)

          if [[ ${#TGZ_ASSETS[@]} -eq 0 ]]; then
            echo "No .tgz npm package asset found on release ${TAG}."
            echo "Available assets:"
            printf ' - %s\n' "${RELEASE_ASSETS[@]}"
            echo "Attach an npm package tarball (for example: cloudless-ai-node-agent-${TAG#v}.tgz) to the release."
            exit 1
          fi

          # Prefer a node-agent package tarball if multiple .tgz assets are present.
          SELECTED_ASSET=""
          for name in "${TGZ_ASSETS[@]}"; do
            if [[ "${name}" == *node-agent* ]]; then
              SELECTED_ASSET="${name}"
              break
            fi
          done
          if [[ -z "${SELECTED_ASSET}" ]]; then
            SELECTED_ASSET="${TGZ_ASSETS[0]}"
          fi

          echo "Using release asset: ${SELECTED_ASSET}"
          gh release download "${TAG}" \
            --repo "${REPO}" \
            --pattern "${SELECTED_ASSET}" \
            --dir dist

          TARBALL_PATH="dist/${SELECTED_ASSET}"
          if [[ ! -f "${TARBALL_PATH}" ]]; then
            echo "Failed to download ${SELECTED_ASSET}"
            exit 1
          fi
          echo "tarball_path=${TARBALL_PATH}" >> "$GITHUB_OUTPUT"

      - name: Publish tarball to npm
        if: steps.existing.outputs.exists != 'true'
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          DIST_TAG: ${{ steps.tag.outputs.dist_tag }}
          TARBALL_PATH: ${{ steps.asset.outputs.tarball_path }}
        run: |
          set -euo pipefail
          if [[ -z "${TARBALL_PATH}" || ! -f "${TARBALL_PATH}" ]]; then
            echo "Failed to locate downloaded package tarball in dist/"
            exit 1
          fi
          TARBALL_PATH="$(realpath "${TARBALL_PATH}")"
          PACKAGE_NAME="@cloudless-ai/node-agent"
          npm config delete //registry.npmjs.org/:_authToken >/dev/null 2>&1 || true
          npm publish "${TARBALL_PATH}" --access public --provenance --tag "${DIST_TAG}"
