name: Publish Node Agent to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (for example: v0.0.6)."
        required: false
        type: string

jobs:
  publish:
    name: Publish @cloudless-ai/node-agent
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_TAG="${{ github.event.release.tag_name || '' }}"
          TAG_INPUT="${{ github.event.inputs.tag }}"
          REF_NAME="${GITHUB_REF_NAME}"
          REF_TYPE="${GITHUB_REF_TYPE}"

          if [[ -n "${RELEASE_TAG}" ]]; then
            TAG="${RELEASE_TAG}"
          elif [[ -n "${TAG_INPUT}" ]]; then
            TAG="${TAG_INPUT}"
          elif [[ "${REF_TYPE}" == "tag" && "${REF_NAME}" == v* ]]; then
            TAG="${REF_NAME}"
          else
            echo "No release tag available. Provide a tag input."
            exit 1
          fi

          if [[ "${TAG}" != v* ]]; then
            echo "Tag must start with v. Got ${TAG}"
            exit 1
          fi

          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Download npm package tarball from release
        id: asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p dist

          mapfile -t RELEASE_ASSETS < <(gh release view "${TAG}" --repo "${REPO}" --json assets --jq '.assets[].name')
          mapfile -t TGZ_ASSETS < <(printf '%s\n' "${RELEASE_ASSETS[@]}" | grep -E '\\.tgz$' || true)

          if [[ ${#TGZ_ASSETS[@]} -eq 0 ]]; then
            echo "No .tgz npm package asset found on release ${TAG}."
            echo "Available assets:"
            printf ' - %s\n' "${RELEASE_ASSETS[@]}"
            echo "Attach an npm package tarball (for example: cloudless-ai-node-agent-${TAG#v}.tgz) to the release."
            exit 1
          fi

          # Prefer a node-agent package tarball if multiple .tgz assets are present.
          SELECTED_ASSET=""
          for name in "${TGZ_ASSETS[@]}"; do
            if [[ "${name}" == *node-agent* ]]; then
              SELECTED_ASSET="${name}"
              break
            fi
          done
          if [[ -z "${SELECTED_ASSET}" ]]; then
            SELECTED_ASSET="${TGZ_ASSETS[0]}"
          fi

          echo "Using release asset: ${SELECTED_ASSET}"
          gh release download "${TAG}" \
            --repo "${REPO}" \
            --pattern "${SELECTED_ASSET}" \
            --dir dist

          TARBALL_PATH="dist/${SELECTED_ASSET}"
          if [[ ! -f "${TARBALL_PATH}" ]]; then
            echo "Failed to download ${SELECTED_ASSET}"
            exit 1
          fi
          echo "tarball_path=${TARBALL_PATH}" >> "$GITHUB_OUTPUT"

      - name: Publish tarball to npm
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          TARBALL_PATH: ${{ steps.asset.outputs.tarball_path }}
        run: |
          set -euo pipefail
          if [[ -z "${TARBALL_PATH}" || ! -f "${TARBALL_PATH}" ]]; then
            echo "Failed to locate downloaded package tarball in dist/"
            exit 1
          fi
          TARBALL_PATH="$(realpath "${TARBALL_PATH}")"
          PACKAGE_NAME="@cloudless-ai/node-agent"
          if npm view "${PACKAGE_NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "Skipping ${PACKAGE_NAME}@${VERSION}; already published."
            exit 0
          fi
          npm config delete //registry.npmjs.org/:_authToken >/dev/null 2>&1 || true
          npm publish "${TARBALL_PATH}" --access public --provenance
